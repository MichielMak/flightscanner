# git-cliff config: turns conventional commits into CHANGELOG.md and decides the next version.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project. Generated by [git-cliff](https://git-cliff.org) from commit messages.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% if commit.breaking %} (**breaking**){% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Squash merges end the title with "(#123)": turn that into a link to the PR.
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/MichielMak/flightscanner/pull/${1}))" },
]
# Commits that end up in the changelog are the ones that trigger a release.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|build|ci|fix)\\(deps", group = "<!-- 4 -->Dependencies" },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^revert", group = "<!-- 5 -->Reverts" },
  # docs, ci, test, style and other chores don't change the app, so no release
  { message = ".*", skip = true },
]
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.1.0"
