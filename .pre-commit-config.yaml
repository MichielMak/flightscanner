repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        # tsconfig.json allows comments, which plain JSON does not
        exclude: "^tsconfig\\.json$"
      - id: check-merge-conflict
      - id: check-added-large-files
        # server/data/airports.json is ~500 KB
        args: [--maxkb=1024]
      - id: end-of-file-fixer
        # Generated by `npm run airports` and `git-cliff`
        exclude: "^(server/data/|CHANGELOG\\.md)$"
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.225.1
    hooks:
      - id: renovate-config-validator
        # --no-global: check the files as repository config (with file
        # arguments the validator otherwise treats them as global config)
        args: [--strict, --no-global]
        files: "(^|/)renovate\\.json5?$"
